<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<meta name="robots" content="noindex, nofollow">
<title>Add a property · Karta concept</title>
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/bundle.css">
<link rel="stylesheet" href="concept.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Inter+Tight:wght@300;700&amp;display=swap">
<style>
body{margin:0;background:#f0f0f2}
a{color:#1B1838}a:hover{color:#3a3a3e}
</style>
<style>
.ka-note { margin: 10px 4px 0; font-size: 11px; line-height: 15px; color: var(--ink-muted); }
.ka-note a { color: var(--ink-tertiary); }
.kc-nav-mini .ka-note { display: none; }
.k-nav-item[aria-disabled="true"]:hover { background: transparent; color: var(--ink-tertiary); }
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">

<svg width="0" height="0" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><defs><linearGradient id="kcSig" x1="0" y1="1" x2="0.35" y2="0"><stop offset="0" stop-color="#FF6E4E"></stop><stop offset="1" stop-color="#E8444F"></stop></linearGradient></defs></svg><div class="kc-app"><aside class="k-sidebar"><button class="k-ws" type="button" aria-label="Wüest Dimensions workspace"><span class="k-ws-tile kc-wd-mark"><span role="img" aria-label="Wüest Dimensions" style="position:relative;display:block;width:28px;height:28px"><span style="position:absolute;display:block;left:17.32px;top:4.67px;width:7.00px;height:17.33px;border-radius:0.30px;transform:skewX(-13deg);transform-origin:0 0;background:linear-gradient(115deg, rgba(255,255,255,0.26) 0%, rgba(255,255,255,0) 40%), linear-gradient(165deg, rgba(97,82,232,0.89), rgba(60,51,160,0.82));backdrop-filter:blur(1.2px) saturate(1.5) brightness(1.05);-webkit-backdrop-filter:blur(1.2px) saturate(1.5) brightness(1.05);box-shadow:inset 0 0.5px 0 rgba(255,255,255,0.30), 0 4.5px 11.2px -3.9px rgba(27,24,56,0.12)"></span><span style="position:absolute;display:block;left:8.05px;top:8.67px;width:7.66px;height:13.33px;border-radius:0.30px;transform:skewX(19deg);transform-origin:0 0;background:linear-gradient(115deg, rgba(255,255,255,0.26) 0%, rgba(255,255,255,0) 40%), linear-gradient(165deg, rgba(255,100,80,0.75), rgba(217,57,47,0.64));backdrop-filter:blur(1.2px) saturate(1.5) brightness(1.05);-webkit-backdrop-filter:blur(1.2px) saturate(1.5) brightness(1.05);box-shadow:inset 0 0.5px 0 rgba(255,255,255,0.30), 0 1.3px 3.4px -1.2px rgba(27,24,56,0.12)"></span><span style="position:absolute;display:block;left:3.68px;top:6.00px;width:8.67px;height:17.33px;border-radius:0.30px;transform:skewX(19deg);transform-origin:0 0;background:linear-gradient(115deg, rgba(255,255,255,0.26) 0%, rgba(255,255,255,0) 40%), linear-gradient(165deg, rgba(227,212,197,0.72), rgba(180,156,134,0.54));backdrop-filter:blur(1.2px) saturate(1.5) brightness(1.05);-webkit-backdrop-filter:blur(1.2px) saturate(1.5) brightness(1.05);box-shadow:inset 0 0.5px 0 rgba(255,255,255,0.30), 0 1.3px 3.4px -1.2px rgba(27,24,56,0.12)"></span></span></span><span class="k-ws-name kc-wd-word"><b>wūest</b>dimensions</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.57" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><button class="k-quick" type="button" style="border:0;font:inherit;width:100%"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg><span>Quick actions</span><span class="k-kbd">/</span></button><nav class="k-nav" aria-label="Shortcuts"><a class="k-nav-item" href="#"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/> <path d="M20 3v4"/> <path d="M22 5h-4"/> <path d="M4 17v2"/> <path d="M5 18H3"/></svg><span>Assistant</span><span class="k-badge-new">New</span></a><a class="k-nav-item" href="#"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/> <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span>Alerts</span><span class="k-count">4</span></a><a class="k-nav-item" href="#"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg><span>Watchlist</span></a></nav><div class="k-section-label">Invest</div><nav class="k-nav" aria-label="Invest"><a class="k-nav-item" href="#"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/> <rect width="7" height="7" x="14" y="3" rx="1"/> <rect width="7" height="7" x="14" y="14" rx="1"/> <rect width="7" height="7" x="3" y="14" rx="1"/></svg><span>Portfolio</span></a><a class="k-nav-item" href="#" aria-current="page"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/> <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/> <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/> <path d="M10 6h4"/> <path d="M10 10h4"/> <path d="M10 14h4"/> <path d="M10 18h4"/></svg><span>Properties</span></a><a class="k-nav-item" href="#"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/> <path d="M15 5.764v15"/> <path d="M9 3.236v15"/></svg><span>Market map</span></a><a class="k-nav-item" href="#"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3 4 7l4 4"/> <path d="M4 7h16"/> <path d="m16 21 4-4-4-4"/> <path d="M20 17H4"/></svg><span>Transactions</span></a><a class="k-nav-item" href="#"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16"/> <path d="m19 9-5 5-4-4-3 3"/></svg><span>Performance</span></a><a class="k-nav-item" href="#"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/> <path d="M14 2v4a2 2 0 0 0 2 2h4"/> <path d="M10 9H8"/> <path d="M16 13H8"/> <path d="M16 17H8"/></svg><span>Documents</span></a></nav><div class="k-section-label">Team</div><nav class="k-nav" aria-label="Team"><a class="k-nav-item" href="#"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/> <circle cx="9" cy="7" r="4"/> <path d="M22 21v-2a4 4 0 0 0-3-3.87"/> <path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Members</span></a><a class="k-nav-item" href="#"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.801 10A10 10 0 1 1 17 3.335"/> <path d="m9 11 3 3L22 4"/></svg><span>Tasks</span></a></nav><div class="k-user"><span class="k-avatar">LS</span><span>Lea Steiner</span><button class="k-iconbtn" type="button" aria-label="Preferences"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="21" x2="14" y1="4" y2="4"/> <line x1="10" x2="3" y1="4" y2="4"/> <line x1="21" x2="12" y1="12" y2="12"/> <line x1="8" x2="3" y1="12" y2="12"/> <line x1="21" x2="16" y1="20" y2="20"/> <line x1="12" x2="3" y1="20" y2="20"/> <line x1="14" x2="14" y1="2" y2="6"/> <line x1="8" x2="8" y1="10" y2="14"/> <line x1="16" x2="16" y1="18" y2="22"/></svg></button></div><p class="ka-note">Design concept with demo data. Not a Wüest Partner product. <a href="/">Back to the concept page</a></p></aside><main class="kc-main">
<div class="kc-body">
<div style="display:flex;align-items:center;gap:12px;padding:2px 4px 4px">
<nav class="kc-crumbs" aria-label="Breadcrumb" style="color:var(--ink-muted)"><a href="property.html" style="color:inherit;text-decoration:none">Properties</a><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.57" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg><span style="color:var(--ink)">{{crumb}}</span></nav>
<sc-if value="{{isReady}}" hint-placeholder-val="{{ false }}"><button class="k-btn k-btn--secondary" type="button" style="margin-left:auto" onClick="{{reset}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.57" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/> <path d="M12 5v14"/></svg>Add another location</button></sc-if>
</div>

<section class="kc-scene" aria-label="Location" style="border-radius:16px">
<div class="kc-scene-grid">

<sc-if value="{{isReady}}" hint-placeholder-val="{{ false }}">
<div class="kc-scene-side">
<div style="display:flex;flex-direction:column;gap:10px">
<h1 class="kc-display">{{a.street}}</h1>
<div class="kc-scene-sub">{{a.town}} · {{a.canton}} · EGID {{a.egid}}</div>
</div>
<table class="kc-scene-table"><tbody>
<sc-for list="{{facts}}" as="r" hint-placeholder-count="6"><tr><td>{{r.label}}</td><td class="now">{{r.value}}<sc-if value="{{r.demo}}" hint-placeholder-val="{{ false }}"><span class="kc-demo">Demo</span></sc-if></td></tr></sc-for>
</tbody></table>
<div class="kc-scene-foot"><span>Hover a floor to inspect it, click to pin</span><span>{{pinNote}}</span></div>
<div class="kc-seg kc-seg--scene" role="group" aria-label="Scene view"><button type="button" aria-pressed="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.57" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/> <path d="m3.3 7 8.7 5 8.7-5"/> <path d="M12 22V12"/></svg>Building</button><button type="button" aria-pressed="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.57" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="7" x="3" y="3" rx="1"/> <rect width="7" height="7" x="3" y="14" rx="1"/> <rect width="7" height="7" x="14" y="14" rx="1"/></svg>Floor plans</button><button type="button" aria-pressed="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.57" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/> <path d="M15 5.764v15"/> <path d="M9 3.236v15"/></svg>Location</button></div>
</div>
</sc-if>

<div class="{{artClass}}">
<svg viewBox="0 0 704 500" width="100%" height="100%" role="img" aria-label="{{svgLabel}}" style="display:block;overflow:visible" onMouseLeave="{{leave}}">
<defs>
<linearGradient id="adL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#211E3E"></stop><stop offset="1" stop-color="#1B1838"></stop></linearGradient>
<linearGradient id="adR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#29264A"></stop><stop offset="1" stop-color="#16142E"></stop></linearGradient>
<filter id="adGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"></feGaussianBlur></filter>
<filter id="adGlowBox" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"></feGaussianBlur></filter>
<linearGradient id="adTagEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.22"></stop><stop offset="0.2" stop-color="#ffffff" stop-opacity="0.08"></stop><stop offset="1" stop-color="#ffffff" stop-opacity="0.08"></stop></linearGradient>
<radialGradient id="adSh" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#000" stop-opacity="0.55"></stop><stop offset="1" stop-color="#000" stop-opacity="0"></stop></radialGradient>
</defs>
<sc-for list="{{grid}}" as="g" hint-placeholder-count="20"><line x1="{{g.x1}}" y1="{{g.y1}}" x2="{{g.x2}}" y2="{{g.y2}}" stroke="rgba(255,255,255,0.05)" stroke-width="1"></line></sc-for>
<polygon points="{{parcel}}" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="3 4"></polygon>
<sc-if value="{{isReady}}" hint-placeholder-val="{{ false }}">
<ellipse cx="{{shadow.cx}}" cy="{{shadow.cy}}" rx="{{shadow.rx}}" ry="{{shadow.ry}}" fill="url(#adSh)"></ellipse>
<sc-for list="{{floors}}" as="f" hint-placeholder-count="5">
<g onMouseEnter="{{f.enter}}" onClick="{{f.pin}}" style="cursor:pointer">
<polygon points="{{f.left}}" fill="{{f.leftFill}}" stroke="rgba(255,255,255,0.28)" stroke-width="1" stroke-linejoin="round"></polygon>
<polygon points="{{f.right}}" fill="{{f.rightFill}}" stroke="rgba(255,255,255,0.28)" stroke-width="1" stroke-linejoin="round"></polygon>
<sc-for list="{{f.units}}" as="u" hint-placeholder-count="8"><polygon points="{{u.pts}}" fill="{{u.fill}}" stroke="{{u.stroke}}" stroke-width="0.8"></polygon></sc-for>
</g>
</sc-for>
<polygon points="{{roof}}" fill="#2e2e33" stroke="rgba(255,255,255,0.28)" stroke-width="1" stroke-linejoin="round"></polygon>
<sc-for list="{{glows}}" as="w" hint-placeholder-count="3"><circle cx="{{w.cx}}" cy="{{w.cy}}" r="{{w.r}}" fill="#FA5848" opacity="0.55" filter="url(#adGlow)" style="pointer-events:none"></circle></sc-for>
<sc-if value="{{hasActive}}" hint-placeholder-val="{{ false }}">
<g style="pointer-events:none">
<polygon points="{{box.left}}" fill="rgba(250,88,72,0.10)"></polygon>
<polygon points="{{box.right}}" fill="rgba(250,88,72,0.10)"></polygon>
<path d="{{box.edges}}" fill="none" stroke="#FA5848" stroke-width="6" opacity="0.45" filter="url(#adGlowBox)"></path>
<path d="{{box.edges}}" fill="none" stroke="#FA5848" stroke-width="1.25" stroke-linejoin="round"></path>
<line x1="{{tag.ax}}" y1="{{tag.ay}}" x2="{{tag.ex}}" y2="{{tag.ay}}" stroke="#FA5848" stroke-width="1"></line>
<circle cx="{{tag.ax}}" cy="{{tag.ay}}" r="3" fill="#FA5848"></circle>
<rect x="{{tag.rx}}" y="{{tag.ry}}" width="200" height="40" rx="8" fill="#1A1736" fill-opacity="0.9" stroke="url(#adTagEdge)" stroke-width="0.5"></rect>
<text x="{{tag.tx}}" y="{{tag.t1}}" font-size="12" fill="#f3f3f4">{{tag.title}}</text>
<text x="{{tag.tx}}" y="{{tag.t2}}" font-size="11" fill="#FFB3A5">{{tag.sub}}</text>
</g>
</sc-if>
</sc-if>
</svg>

<sc-if value="{{isSearch}}" hint-placeholder-val="{{ true }}">
<div class="kc-addr">
<div style="display:flex;flex-direction:column;gap:4px"><h2>Add a location</h2><p>Type a Swiss address. Karta finds the building, loads its 3D shape and register data, and fills the gaps with demo data.</p></div>
<label class="kc-addr-field"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/> <path d="m21 21-4.3-4.3"/></svg><input type="text" placeholder="Street and number, postcode, town" aria-label="Address" value="{{query}}" onChange="{{onQuery}}" onKeyDown="{{onKey}}"></label>
<div class="kc-sugg-list" role="listbox" aria-label="Matching addresses">
<sc-for list="{{suggestions}}" as="s" hint-placeholder-count="5"><button class="kc-sugg" type="button" role="option" onClick="{{s.pick}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.57" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/> <circle cx="12" cy="10" r="3"/></svg><span><span>{{s.street}}</span><small>{{s.town}} · {{s.canton}}</small></span><span class="r">EGID {{s.egid}}</span></button></sc-for>
<sc-if value="{{noMatch}}" hint-placeholder-val="{{ false }}"><p style="padding:8px 10px">No building found for this address. Check the spelling or try the postcode.</p></sc-if>
</div>
<div class="kc-addr-foot">Sources: swisstopo address search, swissBUILDINGS3D for the shape, the Federal Register of Buildings and Dwellings for floors and units. Rents, occupancy and value are demo data until connected.</div>
</div>
</sc-if>

<sc-if value="{{isLoading}}" hint-placeholder-val="{{ false }}">
<div class="kc-addr" style="width:420px">
<div style="display:flex;flex-direction:column;gap:4px"><h2>{{a.street}}</h2><p>{{a.town}} · {{a.canton}}</p></div>
<div style="display:flex;flex-direction:column;gap:10px">
<sc-for list="{{steps}}" as="st" hint-placeholder-count="4"><div class="{{st.cls}}"><i></i><span>{{st.label}}</span><span class="r">{{st.src}}</span></div></sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{isReady}}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;right:0;bottom:0;display:flex;gap:6px;z-index:3"><button class="kc-iconbtn-scene" type="button" aria-label="Zoom in"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/> <path d="M12 5v14"/></svg></button><button class="kc-iconbtn-scene" type="button" aria-label="Zoom out"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button><button class="kc-iconbtn-scene" type="button" aria-label="Rotate model"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/> <path d="M21 3v5h-5"/> <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/> <path d="M8 16H3v5"/></svg></button></div>
</sc-if>
</div>
</div>
</section>

<sc-if value="{{isReady}}" hint-placeholder-val="{{ false }}">
<div class="kc-grid">
<section class="c-card s7">
<div class="c-head"><h3 class="c-title">{{detailTitle}}</h3><span class="c-hint c-push">{{detailHint}}</span></div>
<div class="c-fig"><span class="c-num">{{detail.let}}</span><span class="c-unit">of {{detail.n}} units let</span><div class="c-aside"><small>Average rent</small><b>CHF {{detail.rent}} a month</b></div></div>
<div class="kc-unit-chips"><sc-for list="{{detail.units}}" as="u" hint-placeholder-count="8"><span class="{{u.cls}}">{{u.label}}</span></sc-for></div>
<div class="c-hint">Rents and tenancy states are demo data.</div>
</section>
<section class="c-card s5">
<div class="c-head"><h3 class="c-title">Data sources</h3><span class="c-hint c-push">Loaded {{loadedAt}}</span></div>
<div class="c-rows"><sc-for list="{{sources}}" as="r" hint-placeholder-count="5"><div class="c-row"><span>{{r.label}}</span><span class="m" style="margin-left:auto;margin-right:10px">{{r.src}}</span><span class="{{r.cls}}">{{r.state}}</span></div></sc-for></div>
</section>
</div>
</sc-if>
</div></main></div>
</template>
<script src="dc.js"></script>
<script src="app.js"></script>
<script src="live-add.js"></script>
<script>

var ADDR = [
  { id: "kil", street: "Seestrasse 41", town: "8802 Kilchberg", canton: "ZH", egid: "140 552 017", W: 6, D: 4, F: 5, year: 1987, area: 2140, use: "Residential", rent: 3980, value: 22.6 },
  { id: "zug", street: "Bahnhofstrasse 21", town: "6300 Zug", canton: "ZG", egid: "190 218 403", W: 7, D: 4, F: 6, year: 2008, area: 3460, use: "Mixed use", rent: 4620, value: 41.3 },
  { id: "wad", street: "Hofstrasse 5", town: "8820 Wädenswil", canton: "ZH", egid: "141 307 552", W: 8, D: 5, F: 4, year: 1994, area: 2980, use: "Mixed use", rent: 3410, value: 24.8 },
  { id: "fre", street: "Kantonsstrasse 77", town: "8807 Freienbach", canton: "SZ", egid: "150 044 819", W: 6, D: 5, F: 7, year: 2016, area: 3870, use: "Residential", rent: 3760, value: 38.2 },
  { id: "zum", street: "Dorfstrasse 18", town: "8126 Zumikon", canton: "ZH", egid: "140 931 266", W: 4, D: 3, F: 3, year: 1972, area: 780, use: "Residential", rent: 3150, value: 6.9 }
];
var C30 = 0.8660254, S30 = 0.5;
function seeded(str) {
  var h = 2166136261;
  for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return function () { h += 0x6D2B79F5; var t = h; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function swiss(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "’"); }
function floorName(f) { return f === 0 ? "Ground floor" : "Floor " + f; }

class Component extends DCLogic {
  componentWillUnmount() { (this.timers || []).forEach(clearTimeout); }
  pick(id) {
    var self = this;
    (this.timers || []).forEach(clearTimeout); this.timers = [];
    var x = ADDR.filter(function (a) { return a.id === id; })[0] || ((this.state || {}).live || []).filter(function (a) { return a.id === id; })[0];
    if (!x) return;
    if (ADDR.indexOf(x) < 0) { x = Object.assign({ W: 5, D: 4, F: 4, year: "", area: 0, use: "", rent: 0, value: 0, searchHit: true, pending: true }, x); ADDR.push(x); }
    this.setState({ step: "loading", addr: x.id, loadStep: 0, hover: null, pinned: null });
    [1, 2, 3].forEach(function (k) { self.timers.push(setTimeout(function () { self.setState({ loadStep: k }); }, k * 480)); });
    var dataDone = false, timeDone = false;
    function finish() { if (dataDone && timeDone && self.state.addr === x.id) self.setState({ loadStep: 4, step: "ready", stamp: Date.now() }); }
    this.timers.push(setTimeout(function () { timeDone = true; finish(); }, 4 * 480));
    LIVE.resolve(x).then(function () { dataDone = true; finish(); }, function () { x.live = false; if (x.pending) { x.year = "Unknown"; x.use = "Building"; x.area = 400; x.rent = 3200; x.value = 4; x.pending = false; } dataDone = true; finish(); });
  }

  states(a) {
    var rnd = seeded(a.id), out = [], n = a.W + a.D;
    for (var f = 0; f < a.F; f++) {
      var row = [];
      for (var k = 0; k < n; k++) { var r = rnd(); row.push(r < 0.07 ? "V" : r < 0.1 ? "N" : (a.use === "Mixed use" && f === 0 ? "C" : "L")); }
      out.push(row);
    }
    out[Math.floor(a.F / 2)][2] = "V"; out[Math.floor(a.F / 2)][3] = "V";
    return out;
  }
  renderVals() {
    var self = this, st = Object.assign({ step: "search", query: "", addr: null, loadStep: 0, hover: null, pinned: null }, this.state || {});
    var q = (st.query || "").toLowerCase().trim();
    var searching = q.length >= 3 && st.liveQ !== q;
    var matches = q.length >= 3 ? (st.liveQ === q ? (st.live || []) : []) : ADDR.filter(function (x) { return !x.searchHit && (!q || (x.street + " " + x.town + " " + x.canton).toLowerCase().indexOf(q) > -1); });
    var a = ADDR.filter(function (x) { return x.id === st.addr; })[0] || ADDR[0];
    var W = a.W, D = a.D, F = a.F;
    var cw = Math.min(30, 360 / ((W + D) * C30)), fh = Math.min(28, 240 / F);
    var cx = 250, cy = 262;
    var ox = cx - (W - D) * cw * C30 / 2;
    var oy = cy - ((W + D) * cw * S30 - F * fh) / 2;
    function P(x, y, z) { return [ox + (x - y) * cw * C30, oy + (x + y) * cw * S30 - z * fh]; }
    function pts(arr) { return arr.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" "); }
    var ready = st.step === "ready";
    var grid = [];
    for (var i = -6; i < W + 7; i++) { var p1 = P(i, -6, 0), p2 = P(i, D + 7, 0); grid.push({ x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1] }); }
    for (var j = -6; j < D + 7; j++) { var p3 = P(-6, j, 0), p4 = P(W + 6, j, 0); grid.push({ x1: p3[0], y1: p3[1], x2: p4[0], y2: p4[1] }); }
    var m = 2.2;
    var parcel = pts([P(-m, -m, 0), P(W + m, -m, 0), P(W + m, D + m, 0), P(-m, D + m, 0)]);
    var S = this.states(a);
    var active = st.pinned != null ? st.pinned : st.hover;
    var pad = 0.2, padz = 0.24, floors = [], glows = [];
    function fill(s, lit) {
      if (s === "V") return "url(#kcSig)";
      if (s === "N") return "rgba(255,141,115,0.25)";
      if (s === "C") return lit ? "rgba(255,255,255,0.28)" : "rgba(255,255,255,0.18)";
      return lit ? "rgba(255,255,255,0.20)" : "rgba(255,255,255,0.09)";
    }
    for (var f = 0; f < F; f++) {
      var lit = active === f, units = [];
      for (var c = 0; c < W; c++) {
        var s1 = S[f][c], q1 = [P(c + pad, D, f + padz), P(c + 1 - pad, D, f + padz), P(c + 1 - pad, D, f + 1 - padz), P(c + pad, D, f + 1 - padz)];
        units.push({ pts: pts(q1), fill: fill(s1, lit), stroke: s1 === "N" ? "var(--signal-400)" : "rgba(255,255,255,0.16)" });
        if (s1 === "V") glows.push({ cx: (q1[0][0] + q1[2][0]) / 2, cy: (q1[0][1] + q1[2][1]) / 2, r: cw * 0.55 });
      }
      for (var d = 0; d < D; d++) {
        var s2 = S[f][W + d], q2 = [P(W, d + pad, f + padz), P(W, d + 1 - pad, f + padz), P(W, d + 1 - pad, f + 1 - padz), P(W, d + pad, f + 1 - padz)];
        units.push({ pts: pts(q2), fill: fill(s2, lit), stroke: s2 === "N" ? "var(--signal-400)" : "rgba(255,255,255,0.16)" });
        if (s2 === "V") glows.push({ cx: (q2[0][0] + q2[2][0]) / 2, cy: (q2[0][1] + q2[2][1]) / 2, r: cw * 0.55 });
      }
      (function (ff) {
        floors.push({
          left: pts([P(0, D, ff), P(W, D, ff), P(W, D, ff + 1), P(0, D, ff + 1)]),
          right: pts([P(W, 0, ff), P(W, D, ff), P(W, D, ff + 1), P(W, 0, ff + 1)]),
          leftFill: lit ? "#2c2c31" : "url(#adL)", rightFill: lit ? "#36363c" : "url(#adR)", units: units,
          enter: function () { if ((self.state || {}).hover !== ff) self.setState({ hover: ff }); },
          pin: function () { var cur = (self.state || {}).pinned; self.setState({ pinned: cur === ff ? null : ff }); }
        });
      })(f);
    }
    var e = 0.25, af = active == null ? 0 : active, box = {}, tag = {};
    if (active != null) {
      var a0 = P(-e, D + e, af), a1 = P(W + e, D + e, af), a2 = P(W + e, -e, af), b0 = P(-e, D + e, af + 1), b1 = P(W + e, D + e, af + 1), b2 = P(W + e, -e, af + 1);
      function mv(p) { return p[0].toFixed(1) + " " + p[1].toFixed(1); }
      box = { left: pts([a0, a1, b1, b0]), right: pts([a1, a2, b2, b1]),
        edges: "M" + mv(a0) + " L" + mv(a1) + " L" + mv(a2) + " M" + mv(b0) + " L" + mv(b1) + " L" + mv(b2) + " M" + mv(a0) + " L" + mv(b0) + " M" + mv(a1) + " L" + mv(b1) + " M" + mv(a2) + " L" + mv(b2) };
      var anc = P(W + e, -e, af + 0.5), right = anc[0] + 232 < 704;
      if (!right) anc = P(-e, D + e, af + 0.5);
      var rx = right ? anc[0] + 28 : anc[0] - 228;
      var row = S[af], n = row.length, letc = row.filter(function (s) { return s === "L" || s === "C"; }).length, vac = row.filter(function (s) { return s === "V"; }).length;
      tag = { ax: anc[0], ay: anc[1], ex: right ? rx : rx + 200, rx: rx, ry: anc[1] - 20, hx1: rx + 8, hx2: rx + 192, hy: anc[1] - 19.6, tx: rx + 10, t1: anc[1] - 3, t2: anc[1] + 13,
        title: floorName(af) + (st.pinned != null ? " · pinned" : ""), sub: letc + " of " + n + " let" + (vac ? " · " + vac + " vacant" : "") + " · CHF " + swiss(a.rent * (0.92 + af * 0.03)) };
    }
    var df = active != null ? active : Math.floor(F / 2), drow = S[df];
    var detail = { n: drow.length, let: drow.filter(function (s) { return s === "L" || s === "C"; }).length, rent: swiss(a.rent * (0.92 + df * 0.03)),
      units: drow.map(function (s, k) {
        var lab = (df === 0 ? "EG" : df) + "." + (k + 1 < 10 ? "0" : "") + (k + 1);
        var map = { L: ["positive", "Let"], C: ["neutral", "Commercial"], V: ["negative", "Vacant"], N: ["attention", "Notice given"] }[s];
        return { cls: "k-chip k-chip--" + map[0], label: lab + " " + map[1] };
      }) };
    var stepsDef = [["Address found", "swisstopo"], ["Massing from footprint", "Building register"], ["Floors and units", "Building register"], ["Rents and value", "Demo data"]];
    return {
      crumb: ready ? a.street : "Add a location",
      isSearch: st.step === "search", isLoading: st.step === "loading", isReady: ready,
      artClass: ready ? "kc-scene-art" : "kc-scene-art kc-scene-art--full",
      svgLabel: ready ? a.street + " building model, floors can be hovered" : "Empty parcel grid",
      query: st.query,
      onQuery: function (ev) { var v = ev.target.value; self.setState({ query: v }); LIVE.debounced(v, function (lq, res) { self.setState({ live: res, liveQ: lq }); }); },
      onKey: function (ev) { if (ev.key === "Enter" && matches.length) self.pick(matches[0].id); },
      suggestions: matches.slice(0, 5).map(function (x) { return { street: x.street, town: x.town, canton: x.canton, egid: x.egid, pick: function () { self.pick(x.id); } }; }),
      noMatch: matches.length === 0 && !searching,
      a: a,
      steps: stepsDef.map(function (s, k) { return { label: s[0], src: s[1], cls: "kc-step" + (st.loadStep > k ? " done" : st.loadStep === k ? " now" : "") }; }),
      facts: [
        { label: "Floors", value: String(F), demo: !a.live }, { label: "Units", value: String(a.units != null ? a.units : (W + D) * F), demo: !a.live },
        { label: "Built", value: String(a.year), demo: !a.live }, { label: "Use", value: a.use, demo: !a.live },
        { label: "Living area", value: swiss(a.area) + " m²", demo: !a.live },
        { label: "Value", value: "CHF " + a.value.toFixed(1) + " M", demo: true }, { label: "Average rent", value: "CHF " + swiss(a.rent) + " a month", demo: true }
      ],
      pinNote: st.pinned != null ? floorName(st.pinned) + " pinned" : "",
      grid: grid, parcel: parcel, floors: floors, glows: glows,
      roof: pts([P(0, 0, F), P(W, 0, F), P(W, D, F), P(0, D, F)]),
      shadow: (function () { var c = P(W / 2 - 1.2, D / 2 + 1.6, 0); return { cx: c[0], cy: c[1], rx: (W + D) * cw * 0.62, ry: (W + D) * cw * 0.22 }; })(),
      hasActive: active != null, box: box, tag: tag,
      leave: function () { if ((self.state || {}).hover != null) self.setState({ hover: null }); },
      reset: function () { (self.timers || []).forEach(clearTimeout); self.setState({ step: "search", query: "", addr: null, hover: null, pinned: null, loadStep: 0 }); },
      detailTitle: floorName(df), detailHint: active != null ? (st.pinned != null ? "Pinned, click the floor again to release" : "Hovered") : "Floor with the most vacancies",
      detail: detail,
      loadedAt: "just now",
      sources: [
        { label: "Address and EGID", src: "swisstopo", state: a.live ? "Register" : "Example", cls: a.live ? "k-chip k-chip--info" : "k-chip k-chip--attention" },
        { label: "Building shape", src: "Footprint and floors, building register", state: "Approximate", cls: "k-chip k-chip--attention" },
        { label: "Floors, units, year", src: "Building register", state: a.live ? "Register" : "Example", cls: a.live ? "k-chip k-chip--info" : "k-chip k-chip--attention" },
        { label: "Rents and tenancy", src: "Not connected", state: "Demo data", cls: "k-chip k-chip--attention" },
        { label: "Value", src: "Karta model", state: "Demo data", cls: "k-chip k-chip--attention" }
      ]
    };
  }
}

KartaDC.mount(Component, document.getElementById('dc-root'), document.getElementById('dc-tpl'));
</script>
</body>
</html>
